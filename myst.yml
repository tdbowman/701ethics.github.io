  title: Core Values, Ethics & Issues in the Information Profession
  description: >-
    Open online textbook for LIS 701 Core Values, Ethics, and Issues in the
    Library and Information Profession at Dominican University's School of
    Information Studies. A reader's companion to the assigned texts: what each
    one argues, why it sits where it sits, and how it feeds the semester's
    immersive ethics scenarios.
  keywords:
    - library and information science
    - information ethics
    - intellectual freedom
    - privacy
    - social justice
    - artificial intelligence
    - textbook
  authors:
    - name: Timothy D. Bowman
      affiliations:
        - Dominican University
  github: https://github.com/tdbowman/701ethics.github.io
  copyright: '2026'
  thumbnail: images/cover.png
  exclude:
    - README.md
